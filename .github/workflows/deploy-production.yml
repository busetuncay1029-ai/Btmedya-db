name: BTMEDYA Production Deploy
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "migrations/**"
      - "wrangler.toml"
      - "package.json"
      - ".github/workflows/deploy-production.yml"
      - ".github/actions/cf-token-sec/**"
      - "tools/**"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: btmedya-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    name: Validate, deploy and smoke-test production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate source and assets
        shell: bash
        run: |
          set -euo pipefail
          test -s src/worker.js
          test -s public/index.html
          test -s wrangler.toml
          node --check src/worker.js
          node --check src/gmail-ingest.js
          node --check src/news-intelligence.js
          node --check src/merak-radari.js
          node tools/ux-seo-contract.mjs
          node tools/mobile-regression-gate.mjs
          node tools/link-denetimi.mjs
          git diff --check
      - name: Validate Cloudflare token
        env:
          CF_DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          CF_ACCOUNT_ID: b239acae17aebe894ea76309fe32cdce
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CF_DEPLOY_TOKEN"
          echo "::add-mask::$CF_DEPLOY_TOKEN"
          verify="$(curl -fsS -H "Authorization: Bearer $CF_DEPLOY_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify || true)"
          state="$(jq -r '.result.status // empty' <<<"$verify" 2>/dev/null || true)"
          if [ "$state" != active ]; then
            verify="$(curl -fsS -H "Authorization: Bearer $CF_DEPLOY_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/tokens/verify" || true)"
            state="$(jq -r '.result.status // empty' <<<"$verify" 2>/dev/null || true)"
          fi
          test "$state" = active
          access="$(curl -fsS -H "Authorization: Bearer $CF_DEPLOY_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts")"
          jq -e 'any(.result[]?; .id == "btmedya-db")' <<<"$access" >/dev/null
      - name: Install Wrangler
        run: npm install --no-save --no-package-lock wrangler@4.142.0
      - name: Deploy Worker and assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b239acae17aebe894ea76309fe32cdce
        run: npx wrangler deploy --config wrangler.toml
      - name: Verify live site, admin gate and news endpoints
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --retry 5 --retry-all-errors --retry-delay 3 https://btmedya.com.tr/api/health | tee /tmp/health.json
          grep -q '"ok":true' /tmp/health.json
          test "$(curl -sS -o /dev/null -w '%{http_code}' https://btmedya.com.tr/)" = 200
          admin_code="$(curl -sS -o /tmp/admin.html -w '%{http_code}' https://btmedya.com.tr/admin/)"
          test "$admin_code" = 401 || test "$admin_code" = 200
          test "$(curl -sS -o /dev/null -w '%{http_code}' https://btmedya.com.tr/robots.txt)" = 200
          test "$(curl -sS -o /dev/null -w '%{http_code}' https://btmedya.com.tr/sitemap.xml)" = 200
          test "$(curl -sS -o /dev/null -w '%{http_code}' https://btmedya.com.tr/rss.xml)" = 200
          test "$(curl -sS -o /dev/null -w '%{http_code}' https://btmedya.com.tr/api/integrations/gmail/news -X POST -H 'content-type: application/json' --data '{"messages":[]}' )" = 401
